<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="1100" height="620" fill="white"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700">Burndown — Sprint 1</text>
  <text x="550" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Story Points restantes: linha ideal x linha real</text>

  <!-- Plot area -->
  <g transform="translate(90,100)">
    <rect x="0" y="0" width="920" height="420" fill="white" stroke="#cccccc"/>

    <!-- horizontal grid -->
    <g stroke="#e6e6e6" stroke-width="1">
      <line x1="0" y1="420" x2="920" y2="420"/>
      <line x1="0" y1="336" x2="920" y2="336"/>
      <line x1="0" y1="252" x2="920" y2="252"/>
      <line x1="0" y1="168" x2="920" y2="168"/>
      <line x1="0" y1="84" x2="920" y2="84"/>
      <line x1="0" y1="0" x2="920" y2="0"/>
    </g>

    <!-- y labels -->
    <g font-family="Arial, sans-serif" font-size="13" fill="#333">
      <text x="-18" y="425" text-anchor="end">0</text>
      <text x="-18" y="341" text-anchor="end">10</text>
      <text x="-18" y="257" text-anchor="end">20</text>
      <text x="-18" y="173" text-anchor="end">30</text>
      <text x="-18" y="89" text-anchor="end">40</text>
      <text x="-18" y="5" text-anchor="end">50</text>
    </g>

    <!-- x labels -->
    <g font-family="Arial, sans-serif" font-size="12" fill="#333">
      <text x="0" y="448" text-anchor="middle">21/09</text>
      <text x="92" y="448" text-anchor="middle">22/09</text>
      <text x="184" y="448" text-anchor="middle">23/09</text>
      <text x="276" y="448" text-anchor="middle">24/09</text>
      <text x="368" y="448" text-anchor="middle">25/09</text>
      <text x="460" y="448" text-anchor="middle">26/09</text>
      <text x="552" y="448" text-anchor="middle">27/09</text>
      <text x="644" y="448" text-anchor="middle">28/09</text>
      <text x="736" y="448" text-anchor="middle">29/09</text>
      <text x="828" y="448" text-anchor="middle">30/09</text>
      <text x="920" y="448" text-anchor="middle">01/10</text>
    </g>

    <!-- axis labels -->
    <text x="-58" y="210" transform="rotate(-90 -58 210)" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Story Points restantes</text>
    <text x="460" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Data</text>

    <!-- ideal line -->
    <polyline fill="none" stroke="#4f81bd" stroke-width="4"
      points="0,100.8 92,132.72 184,164.64 276,196.56 368,228.48 460,260.4 552,292.32 644,324.24 736,356.16 828,388.08 920,420"/>
    <g fill="#4f81bd">
      <circle cx="0" cy="100.8" r="5"/><circle cx="92" cy="132.72" r="5"/>
      <circle cx="184" cy="164.64" r="5"/><circle cx="276" cy="196.56" r="5"/>
      <circle cx="368" cy="228.48" r="5"/><circle cx="460" cy="260.4" r="5"/>
      <circle cx="552" cy="292.32" r="5"/><circle cx="644" cy="324.24" r="5"/>
      <circle cx="736" cy="356.16" r="5"/><circle cx="828" cy="388.08" r="5"/>
      <circle cx="920" cy="420" r="5"/>
    </g>

    <!-- real line -->
    <polyline fill="none" stroke="#c0504d" stroke-width="4"
      points="0,100.8 92,100.8 184,100.8 276,100.8 368,100.8 460,100.8 552,100.8 644,100.8 736,75.6 828,75.6 920,193.2"/>
    <g fill="#c0504d">
      <circle cx="0" cy="100.8" r="5"/><circle cx="92" cy="100.8" r="5"/>
      <circle cx="184" cy="100.8" r="5"/><circle cx="276" cy="100.8" r="5"/>
      <circle cx="368" cy="100.8" r="5"/><circle cx="460" cy="100.8" r="5"/>
      <circle cx="552" cy="100.8" r="5"/><circle cx="644" cy="100.8" r="5"/>
      <circle cx="736" cy="75.6" r="5"/><circle cx="828" cy="75.6" r="5"/>
      <circle cx="920" cy="193.2" r="5"/>
    </g>

    <!-- legend -->
    <g font-family="Arial, sans-serif" font-size="14">
      <line x1="610" y1="-30" x2="650" y2="-30" stroke="#4f81bd" stroke-width="4"/>
      <text x="660" y="-25">Ideal</text>
      <line x1="735" y1="-30" x2="775" y2="-30" stroke="#c0504d" stroke-width="4"/>
      <text x="785" y="-25">Real</text>
    </g>

    <!-- annotation for bug -->
    <line x1="736" y1="75.6" x2="736" y2="32" stroke="#666" stroke-dasharray="4 4"/>
    <text x="746" y="28" font-family="Arial, sans-serif" font-size="12" fill="#333">BUG01 (+3 SP)</text>
  </g>

  <text x="550" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">
    Planejamento inicial: 38 SP · Escopo final: 41 SP · Concluído: 14 SP · Restante: 27 SP
  </text>
</svg>