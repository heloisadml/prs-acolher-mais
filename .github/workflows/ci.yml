name: PRS - prototipo

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Validar protótipo React
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Atualizar npm
        run: npm install -g npm@latest

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "package.json não encontrado."
            exit 1
          fi

      - name: Executar testes
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test -- --if-present
          else
            echo "Testes automatizados ainda não configurados."
          fi

      - name: Verificar código (Lint)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "Verificação ESLint ainda não configurada."
          fi

      - name: Verificar compilação do protótipo
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "Script de build ainda não configurado."
          fi

      - name: Verificar estrutura básica
        run: |
          test -d .github
          test -f README.md
          test -f package.json

      - name: Finalizar CI
        run: |
          echo "Pipeline de integração contínua executado com sucesso."
